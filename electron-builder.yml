appId: com.reza.sshmanager
productName: SSH Manager
directories:
  buildResources: build
  output: release
# These globs plus every entry in package.json's "dependencies" (pulled in
# transitively) make up the asar. Renderer packages are already bundled into
# out/ by Vite, so listing one as a runtime dependency ships a second, unused
# copy of it — monaco-editor alone is ~72 MB that way. Keep "dependencies" to
# what the main/preload processes require() at runtime (currently just ssh2);
# everything else belongs in "devDependencies".
files:
  - out/**/*
  - resources/**/*
  - package.json
win:
  icon: build/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: ${productName}-${version}-${arch}.dmg
